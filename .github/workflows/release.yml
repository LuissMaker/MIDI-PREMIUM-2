name: Build and publish MIDI Premium 2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app_source/requirements.txt pyinstaller==6.11.1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path app_source/app/version.py -Pattern '__version__ = "([0-9.]+)' | Select-Object -First 1
          if (-not $line) { throw 'Version not found' }
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean MIDI_Premium_2.spec
          if (!(Test-Path 'dist/MIDI Premium 2/MIDI Premium 2.exe')) { throw 'Executable not generated' }

      - name: Package portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path 'dist/MIDI Premium 2/*' -DestinationPath 'release/MIDI_Premium_2_v${{ steps.ver.outputs.version }}_Portable.zip' -Force

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MIDI_Premium_2_Setup.iss'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MIDI Premium 2 v${{ steps.ver.outputs.version }}
          body_path: app_source/CHANGELOG.md
          files: |
            release/MIDI_Premium_2_v${{ steps.ver.outputs.version }}_Portable.zip
            release/MIDI_Premium_2_Setup_v${{ steps.ver.outputs.version }}.exe
          make_latest: true
