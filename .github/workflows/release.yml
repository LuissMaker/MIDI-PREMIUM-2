name: Build and publish MIDI Premium 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source_bundle/v111_xz_*.b64'
      - 'MIDI_Premium_2.spec'
      - 'MIDI_Premium_2_Setup.iss'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct v1.1.1 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem source_bundle/v111_xz_*.b64 | Sort-Object Name
          if ($parts.Count -ne 8) { throw "Expected 8 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('midi_src_v111.tar.xz', [Convert]::FromBase64String($b64))
          tar -xf midi_src_v111.tar.xz
          if (!(Test-Path 'app_source/main.py')) { throw 'Source reconstruction failed' }

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app_source/requirements.txt pyinstaller==6.11.1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean MIDI_Premium_2.spec
          if (!(Test-Path 'dist/MIDI Premium 2/MIDI Premium 2.exe')) { throw 'Executable not generated' }

      - name: Package portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path 'dist/MIDI Premium 2/*' -DestinationPath 'release/MIDI_Premium_2_v1.1.1_Portable.zip' -Force

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MIDI_Premium_2_Setup.iss
          if (!(Test-Path 'release/MIDI_Premium_2_Setup_v1.1.1.exe')) { throw 'Installer not generated' }

      - name: Publish v1.1.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: MIDI Premium 2 v1.1.1 Stable
          body_path: app_source/CHANGELOG.md
          files: |
            release/MIDI_Premium_2_v1.1.1_Portable.zip
            release/MIDI_Premium_2_Setup_v1.1.1.exe
          make_latest: true
