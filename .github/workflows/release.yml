name: Build and publish MIDI Premium 2

on:
  push:
    branches: [main]
    paths:
      - 'source_bundle/v111_xz_*.b64'
      - 'patches_v111/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: midi-premium-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "source_bundle/v111_xz_*.b64" | Sort-Object Name
          if ($parts.Count -lt 2) { throw "Source bundle parts not found" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ""
          [IO.File]::WriteAllBytes("source_bundle_v111.tar.xz", [Convert]::FromBase64String($b64))
          New-Item -ItemType Directory -Force -Path reconstructed | Out-Null
          tar -xf source_bundle_v111.tar.xz -C reconstructed
          $spec = Get-ChildItem reconstructed -Filter "MIDI_Premium_2.spec" -File -Recurse | Select-Object -First 1
          if (-not $spec) { throw "MIDI_Premium_2.spec not found after extraction" }
          "PROJECT_ROOT=$($spec.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Apply v1.1.1 visual patch
        shell: pwsh
        run: python patches_v111/apply_patch.py "$env:PROJECT_ROOT"

      - name: Setup Python 3.11 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_ROOT/app_source/requirements.txt" pyinstaller==6.11.1
          choco install innosetup -y --no-progress

      - name: Verify Python source
        shell: pwsh
        run: python -m compileall -q "$env:PROJECT_ROOT/app_source"

      - name: Build application
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_ROOT"
          python -m PyInstaller --noconfirm --clean MIDI_Premium_2.spec
          if (!(Test-Path "dist/MIDI Premium 2/MIDI Premium 2.exe")) { throw "Executable not generated" }

      - name: Package portable
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_ROOT"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/MIDI Premium 2/*" -DestinationPath "release/MIDI_Premium_2_v1.1.1_Portable.zip" -Force

      - name: Build installer
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_ROOT"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MIDI_Premium_2_Setup.iss
          if (!(Test-Path "release/MIDI_Premium_2_Setup_v1.1.1.exe")) { throw "Installer not generated" }

      - name: Publish v1.1.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: MIDI Premium 2 v1.1.1
          body: |
            MIDI Premium 2 v1.1.1

            - Interfaz principal más limpia y compacta.
            - PADs y perillas simplificados.
            - Mejor aprovechamiento vertical.
            - Estado MIDI más discreto.
            - Corrección del OSD/overlay para evitar recortes.
            - Conserva perfiles, PADs y configuración existente.
          files: |
            ${{ env.PROJECT_ROOT }}/release/MIDI_Premium_2_v1.1.1_Portable.zip
            ${{ env.PROJECT_ROOT }}/release/MIDI_Premium_2_Setup_v1.1.1.exe
          make_latest: true

      - name: Publish update manifest after successful release
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"
          @'
          {
            "version": "1.1.1",
            "tag": "v1.1.1",
            "repo": "LuissMaker/MIDI-PREMIUM-2",
            "setup_asset": "MIDI_Premium_2_Setup_v1.1.1.exe",
            "portable_asset": "MIDI_Premium_2_v1.1.1_Portable.zip",
            "notes": "Interfaz más limpia y compacta, PADs y perillas simplificados, mejor aprovechamiento vertical y corrección del OSD/overlay para evitar recortes."
          }
          '@ | Set-Content latest.json -Encoding utf8
          git config user.name "MIDI Premium Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Publish v1.1.1 update manifest [skip ci]"
          git push origin HEAD:main
