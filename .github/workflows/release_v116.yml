name: Release MIDI Premium 2 v1.1.6
on:
  push:
    paths:
      - '.github/workflows/release_v116.yml'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare v1.1.6 source
        shell: pwsh
        run: |
          $b=(Get-Content source_bundle/full_v114.b64 -Raw).Trim()
          [IO.File]::WriteAllBytes("base.tar.xz",[Convert]::FromBase64String($b))
          New-Item -ItemType Directory -Force -Path reconstructed | Out-Null
          tar -xf base.tar.xz -C reconstructed
          if ($LASTEXITCODE -ne 0) { throw "Could not extract source bundle" }
          $p=(Get-ChildItem reconstructed -Filter MIDI_Premium_2.spec -Recurse | Select-Object -First 1).Directory.FullName
          if (-not $p) { throw "Project root not found" }
          "PROJECT_ROOT=$p" >> $env:GITHUB_ENV

          $v115="$env:GITHUB_WORKSPACE/patches_v115/files"
          Copy-Item "$v115/app_source/main.py" "$p/app_source/main.py" -Force
          Copy-Item "$v115/app_source/app/actions/photoshop_psd.py" "$p/app_source/app/actions/photoshop_psd.py" -Force
          Copy-Item "$v115/app_source/app/widgets/config_dialogs.py" "$p/app_source/app/widgets/config_dialogs.py" -Force
          Copy-Item "$v115/app_source/app/ui/osd.py" "$p/app_source/app/ui/osd.py" -Force
          Copy-Item "$v115/app_source/app/version.py" "$p/app_source/app/version.py" -Force
          Copy-Item "$v115/MIDI_Premium_2.spec" "$p/MIDI_Premium_2.spec" -Force
          Copy-Item "$v115/MIDI_Premium_2_Setup.iss" "$p/MIDI_Premium_2_Setup.iss" -Force
          $icon=(Get-Content "$env:GITHUB_WORKSPACE/patches_v115/app_icon_ico.b64" -Raw).Trim()
          [IO.File]::WriteAllBytes("$p/app_source/assets/app_icon.ico",[Convert]::FromBase64String($icon))

          $v116="$env:GITHUB_WORKSPACE/patches_v116/files"
          Copy-Item "$v116/app_source/app/widgets/config_dialogs.py" "$p/app_source/app/widgets/config_dialogs.py" -Force
          Copy-Item "$v116/app_source/app/version.py" "$p/app_source/app/version.py" -Force
          Copy-Item "$v116/MIDI_Premium_2_Setup.iss" "$p/MIDI_Premium_2_Setup.iss" -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Build and verify
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_ROOT/app_source/requirements.txt" pyinstaller==6.11.1
          choco install innosetup -y --no-progress
          python -m compileall -q "$env:PROJECT_ROOT/app_source"
          Get-Content "$env:PROJECT_ROOT/app_source/app/version.py"
          Set-Location "$env:PROJECT_ROOT"
          python -m PyInstaller --noconfirm --clean MIDI_Premium_2.spec
          if (!(Test-Path "dist/MIDI Premium 2/MIDI Premium 2.exe")) { throw "Executable not generated" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist/MIDI Premium 2/*" -DestinationPath "release/MIDI_Premium_2_v1.1.6_Portable.zip" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" MIDI_Premium_2_Setup.iss
          if (!(Test-Path "release/MIDI_Premium_2_Setup_v1.1.6.exe")) { throw "Installer not generated" }

      - name: Publish v1.1.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.6
          name: MIDI Premium 2 v1.1.6
          body: |
            MIDI Premium 2 v1.1.6

            - Selector "Insertar desde PSD" reorganizado automáticamente por los grupos reales del PSD.
            - Se eliminan los filtros/categorías superiores para ganar espacio.
            - Los grupos nuevos creados en Photoshop aparecen automáticamente por nombre y contenido.
            - Todos los grupos viven en una sola vista jerárquica, sin pestañas.
            - Grupos y subgrupos pueden expandirse o colapsarse.
            - Las capas fuera de grupos aparecen en "Sin grupo".
            - Se evita duplicar contenido si se selecciona a la vez un grupo y uno de sus hijos.
          files: |
            ${{ env.PROJECT_ROOT }}/release/MIDI_Premium_2_v1.1.6_Portable.zip
            ${{ env.PROJECT_ROOT }}/release/MIDI_Premium_2_Setup_v1.1.6.exe
          make_latest: true

      - name: Update manifest
        shell: pwsh
        run: |
          Set-Location "$env:GITHUB_WORKSPACE"
          '{"version":"1.1.6","tag":"v1.1.6","repo":"LuissMaker/MIDI-PREMIUM-2","setup_asset":"MIDI_Premium_2_Setup_v1.1.6.exe","portable_asset":"MIDI_Premium_2_v1.1.6_Portable.zip","notes":"Selector PSD agrupado dinámicamente por los grupos reales del documento, sin pestañas ni filtros superiores."}' | Set-Content latest.json
          git config user.name "MIDI Premium Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          git commit -m "Publish v1.1.6 manifest [skip ci]"
          git push
